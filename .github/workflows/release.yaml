name: Release

on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validation.yaml

  release-please:
    needs: validation
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-environment

      - name: Build package
        run: pnpm build

      - name: Resolve release channel
        id: channel
        run: node scripts/emitReleaseChannel.ts

      - name: Publish to npm registry
        run: pnpm publish --no-git-checks --access public --tag ${{ steps.channel.outputs.npm_tag }}

      - name: Keep the newest release marked latest on GitHub
        if: ${{ steps.channel.outputs.mark_github_latest == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --latest=false
